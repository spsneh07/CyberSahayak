services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-cyberassist}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyber}"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args: {INSTALL_ML: "${INSTALL_ML:-false}"}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cyber}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-cyberassist}
      KNOWLEDGE_BASE_DIR: /knowledge_base
    volumes: ["./knowledge_base:/knowledge_base:ro", "hfcache:/root/.cache/huggingface"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: "http://localhost:8000"}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  hfcache:
